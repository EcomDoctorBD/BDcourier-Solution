name: Fix ECS Network & Security Groups

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-network.yml'

jobs:
  configure-network:
    name: Fix ECS Fargate Network Configuration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect and Fix Security Group Egress Rules
        run: |
          echo "=== [1/5] Fetching ECS Service Configuration ==="
          SERVICE_JSON=$(aws ecs describe-services --cluster delivery1-cluster --services delivery1-service)
          echo "$SERVICE_JSON" > service-info.json

          # Extract subnets, security groups, and assignPublicIp
          SG_IDS=$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups[]' service-info.json)
          SUBNET_IDS=$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.subnets | join(",")' service-info.json)
          SUBNET_ARRAY=$(jq -c '.services[0].networkConfiguration.awsvpcConfiguration.subnets' service-info.json)
          ASSIGN_PUBLIC_IP=$(jq -r '.services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp' service-info.json)
          TG_ARN=$(jq -r '.services[0].loadBalancers[0].targetGroupArn // empty' service-info.json)

          echo "Current Security Groups: $SG_IDS"
          echo "Current Subnets: $SUBNET_IDS"
          echo "Current AssignPublicIp: $ASSIGN_PUBLIC_IP"
          echo "Current Target Group ARN: $TG_ARN"

          echo "=== [2/5] Ensuring All Outbound & Inbound Traffic on ECS Task Security Groups ==="
          for sg in $SG_IDS; do
            echo "Checking egress rules for Security Group: $sg"
            aws ec2 describe-security-groups --group-ids "$sg" --query "SecurityGroups[0].IpPermissionsEgress"
            
            echo "Authorizing egress to 0.0.0.0/0 (all protocols & ports) on $sg..."
            aws ec2 authorize-security-group-egress \
              --group-id "$sg" \
              --protocol -1 \
              --port -1 \
              --cidr 0.0.0.0/0 2>&1 || echo "Egress rule already exists or allowed."

            echo "Authorizing inbound traffic on port 3000 to $sg from ALB / 0.0.0.0/0..."
            aws ec2 authorize-security-group-ingress \
              --group-id "$sg" \
              --protocol tcp \
              --port 3000 \
              --cidr 0.0.0.0/0 2>&1 || echo "Inbound port 3000 rule already exists."
          done

          echo "=== [3/5] Updating ECS Service to Assign Public IP ==="
          # Build network configuration JSON for update-service
          SG_ARRAY=$(jq -c '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups' service-info.json)
          
          echo "Updating ECS service with assignPublicIp=ENABLED and forcing new deployment..."
          aws ecs update-service \
            --cluster delivery1-cluster \
            --service delivery1-service \
            --network-configuration "awsvpcConfiguration={subnets=${SUBNET_ARRAY},securityGroups=${SG_ARRAY},assignPublicIp=ENABLED}" \
            --force-new-deployment

          echo "=== [4/5] Checking Target Group Health & Port Settings ==="
          if [ -n "$TG_ARN" ]; then
            aws elbv2 describe-target-groups --target-group-arns "$TG_ARN"
            echo "Current target health:"
            aws elbv2 describe-target-health --target-group-arn "$TG_ARN" || true
          fi

          echo "=== [4.1] Checking ALB DNS & Security Groups ==="
          ALB_ARN="arn:aws:elasticloadbalancing:ap-southeast-2:496663582013:loadbalancer/app/delivery1-alb/d4f7f14e6f1d08d9"
          aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN"
          ALB_SG=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query "LoadBalancers[0].SecurityGroups[]" --output text)
          echo "ALB Security Groups: $ALB_SG"
          for asg in $ALB_SG; do
            echo "Checking ALB SG: $asg"
            aws ec2 describe-security-groups --group-ids "$asg" --query "SecurityGroups[0].IpPermissions"
            echo "Authorizing HTTP (port 80) and HTTPS (port 443) from 0.0.0.0/0 on ALB SG $asg..."
            aws ec2 authorize-security-group-ingress --group-id "$asg" --protocol tcp --port 80 --cidr 0.0.0.0/0 2>&1 || true
            aws ec2 authorize-security-group-ingress --group-id "$asg" --protocol tcp --port 443 --cidr 0.0.0.0/0 2>&1 || true
          done

          echo "=== [4.2] Checking ALB Listeners & ACM Certificates ==="
          echo "Current ALB Listeners:"
          aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN"

          echo "Checking Available ACM SSL Certificates in ap-southeast-2:"
          ACM_CERTS=$(aws acm list-certificates --region ap-southeast-2)
          echo "$ACM_CERTS"

          ISSUED_CERT_ARN=$(echo "$ACM_CERTS" | jq -r '.CertificateSummaryList[] | select(.Status=="ISSUED") | .CertificateArn' | head -n 1)
          if [ -n "$ISSUED_CERT_ARN" ]; then
            echo "Found Issued SSL Certificate: $ISSUED_CERT_ARN. Ensuring HTTPS:443 Listener is created..."
            aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTPS \
              --port 443 \
              --certificates CertificateArn="$ISSUED_CERT_ARN" \
              --default-actions Type=forward,TargetGroupArn="$TG_ARN" 2>&1 || echo "HTTPS Listener may already exist or error."
          else
            echo "NOTICE: No ISSUED ACM Certificate found in ap-southeast-2."
            echo "AWS ALB cannot terminate HTTPS on port 443 without an ACM certificate for a verified custom domain."
          fi

          echo "=== [5/5] Checking ECS Tasks and Recent Container Logs ==="
          TASK_ARNS=$(aws ecs list-tasks --cluster delivery1-cluster --service-name delivery1-service --query "taskArns[]" --output text)
          if [ -n "$TASK_ARNS" ]; then
            echo "Tasks found: $TASK_ARNS"
            aws ecs describe-tasks --cluster delivery1-cluster --tasks $TASK_ARNS
          else
            echo "No running tasks. Checking recently stopped tasks..."
            STOPPED_TASKS=$(aws ecs list-tasks --cluster delivery1-cluster --service-name delivery1-service --desired-status STOPPED --query "taskArns[]" --output text)
            if [ -n "$STOPPED_TASKS" ]; then
              echo "Stopped tasks: $STOPPED_TASKS"
              aws ecs describe-tasks --cluster delivery1-cluster --tasks $STOPPED_TASKS --query "tasks[*].{TaskArn:taskArn,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[*].{Name:name,LastStatus:lastStatus,ExitCode:exitCode,Reason:reason}}"
            fi
            echo "Recent ECS service events:"
            aws ecs describe-services --cluster delivery1-cluster --services delivery1-service --query "services[0].events[0:5]"
          fi
