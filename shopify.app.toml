# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bc8cab60c84e1dcbb55b4c057645e5c8"
name = "SafeParcel BD"
application_url = "https://b-dcourier-solution.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/fulfilled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/edited" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments,read_shipping,write_shipping,read_customers,read_products"

[auth]
redirect_urls = [
  "https://b-dcourier-solution.vercel.app/auth/callback",
  "https://b-dcourier-solution.vercel.app/auth/shopify/callback",
  "https://b-dcourier-solution.vercel.app/api/auth/callback"
]
